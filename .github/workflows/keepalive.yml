name: Keep scheduler active

on:
  schedule:
    - cron: "17 12 1 * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@v4
      - name: Record monthly activity
        shell: bash
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .scheduler-heartbeat
          git config user.name "nexus-charts-bot"
          git config user.email "nexus-charts-bot@users.noreply.github.com"
          git add .scheduler-heartbeat
          git commit -m "chore: keep scheduler active"
          git push
